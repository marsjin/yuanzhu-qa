services:
  customer-service:
    build: .
    env_file: .env
    environment:
      CS_INDEX_DIR: /data/index
      CS_SESSION_DB: /data/sessions.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - cs_data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cs_data:
